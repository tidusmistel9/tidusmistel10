wed}.hidden{display:none!important}.result-score{font-size:2.3rem;font-weight:800;margin:14px 0}.small{font-size:.9rem;margin-top:20px}#missedList p{border-top:1px solid #e3e8f1;padding-top:10px}@media(max-width:500px){body{padding:10px 7px}.panel{border-radius:13px}.choice{padding:11px}}
</style></head><body><main><section class="panel" id="quizPanel"><h1>Government & Democracy Quiz</h1><p class="sub">The old and new study topics are combined with duplicate concepts removed. Questions and answer positions are shuffled, and wording changes between rounds.</p><div class="top"><span class="pill" id="number"></span><span class="pill" id="score">Score: 0</span></div><div class="bar"><span id="bar"></span></div><div class="section" id="section"></div><h2 id="question"></h2><div id="choices"></div><div id="feedback" class="feedback" aria-live="polite"></div><div class="controls"><button class="action secondary" id="restart">Restart quiz</button><button class="action" id="next" disabled>Next question</button></div><p class="small">Answer choices are shuffled, and wrong answers stay specific to each question.</p></section><section class="panel hidden" id="result"><h1>Quiz complete!</h1><div class="result-score" id="finalScore"></div><p id="message" class="sub"></p><div class="actions"><button class="action" id="again">Try again with a new order</button><button class="action secondary" id="review">Review missed questions</button></div><div id="missedList" class="small hidden"></div></section></main><script>
const bank = [{"section": "Government", "prompts": ["Why do we need government? Name one reason.", "Which is one important job of government?"], "corrects": ["To make laws, provide services, and help keep order", "Government helps organize society and make rules"], "wrongs": ["To choose everyone's hobbies", "To stop all people from disagreeing", "To make everyone have the same job"]}, {"section": "Government", "prompts": ["What is a democracy?", "Which statement describes democracy?", "A democracy is a system where…"], "corrects": ["People have a say in how they are governed", "People have a voice in choosing leaders and decisions"], "wrongs": ["One ruler controls everything", "A small group alone holds all power", "A royal family automatically makes every decision"]}, {"section": "Government", "prompts": ["What is an authoritarian government?", "Which statement describes authoritarian rule?"], "corrects": ["Leaders hold strong power and people's freedoms are limited", "Political power is concentrated and public freedoms are restricted"], "wrongs": ["Every citizen decides every law directly", "All power is shared equally by everyone", "The government has no authority"]}, {"section": "Government", "prompts": ["What is a monarchy?", "Which system has a king or queen as monarch?"], "corrects": ["A system with a king, queen, or other monarch as head of state", "A government headed by a monarch"], "wrongs": ["A government ruled by a small elected committee", "A system where citizens vote on every law", "A system where judges run the country"]}, {"section": "Government", "prompts": ["What is a dictatorship?", "Which statement best describes dictatorship?"], "corrects": ["One ruler holds most power with few effective limits", "A system where one leader has nearly unchecked power"], "wrongs": ["All citizens vote on every law", "Power is shared equally among all citizens", "A group of elected representatives makes all decisions"]}, {"section": "Government", "prompts": ["What is an oligarchy?", "Which system is controlled by a small group?"], "corrects": ["A small group holds most political power", "A few people control the government"], "wrongs": ["Every citizen votes directly on each issue", "A king or queen has only a ceremonial role", "All decisions are made by public referendum"]}, {"section": "Government", "prompts": ["What is direct democracy?", "Which example shows direct democracy?"], "corrects": ["Citizens vote directly on issues or laws", "People themselves vote on a proposal"], "wrongs": ["Citizens elect representatives to decide for them", "One ruler makes all decisions", "A court chooses the government"]}, {"section": "Government", "prompts": ["What is indirect democracy?", "Which example shows indirect democracy?"], "corrects": ["Citizens elect representatives to make decisions", "People choose representatives to speak and decide for them"], "wrongs": ["Everyone votes directly on every law", "A ruler inherits the position", "A small unelected group controls all power"]}, {"section": "Decision-making", "prompts": ["What does consensus mean?", "A group reaches consensus when…"], "corrects": ["The group reaches a general agreement", "People come to an agreement they can broadly support"], "wrongs": ["The largest group ignores everyone else", "One person forces everyone to agree", "A judge sentences someone in court"]}, {"section": "Decision-making", "prompts": ["What does majority rule mean?", "In majority rule, which choice usually wins?"], "corrects": ["The choice supported by more than half", "The option that gets over 50 percent of the votes"], "wrongs": ["The choice supported by only one person", "Everyone must agree before a choice is made", "The oldest person chooses"]}, {"section": "Decision-making", "prompts": ["What does politics mean?", "Politics is mainly about…"], "corrects": ["How people make group decisions and use power", "How communities make decisions about public life"], "wrongs": ["Studying plants and animals", "Choosing personal hobbies", "Measuring weather"]}, {"section": "Parties and media", "prompts": ["What is an opposition party?", "What does an opposition party do?"], "corrects": ["It challenges the government and offers other ideas", "It questions the government and presents alternatives"], "wrongs": ["It must agree with every government decision", "It replaces the courts", "It stops people from discussing politics"]}, {"section": "Parties and media", "prompts": ["What does opposition mean in politics?", "Political opposition means…"], "corrects": ["Disagreeing with or challenging those in power", "Questioning leaders or offering a different approach"], "wrongs": ["Automatically supporting every government action", "Cancelling all elections", "Choosing leaders only by inheritance"]}, {"section": "Parties and media", "prompts": ["What is a free press?", "What does freedom of the press allow?"], "corrects": ["Media can report and criticize without improper government control", "News organizations can investigate and report without unfair censorship"], "wrongs": ["The government approves every news story", "Only positive stories about leaders can be published", "The press chooses election winners"]}, {"section": "Rights", "prompts": ["What is freedom of speech?", "Freedom of speech means people can generally…"], "corrects": ["Express ideas and opinions within the law", "Share their views, while following applicable laws"], "wrongs": ["Force everyone to agree", "Say anything without any possible legal limit", "Prevent others from speaking"]}, {"section": "Decision-making", "prompts": ["What is consultation?", "A leader asks people for their views before deciding. What is this?"], "corrects": ["Asking people for opinions or advice", "Seeking advice or views before making a decision"], "wrongs": ["Forcing people to obey", "A judge making a final ruling", "Choosing a ruler by inheritance"]}, {"section": "Rights", "prompts": ["What is the rule of law?", "Under the rule of law…"], "corrects": ["Everyone, including leaders, must follow the law", "The law applies to citizens and government leaders alike"], "wrongs": ["Leaders can ignore laws whenever they want", "Only ordinary citizens must obey laws", "Laws apply only when everyone agrees"]}, {"section": "Rights", "prompts": ["What does equality mean?", "Which statement best describes equality?"], "corrects": ["People have equal rights and should be treated fairly under the law", "People deserve equal protection and fair treatment under the law"], "wrongs": ["Everyone must have the same hobbies", "Everyone must own the same things", "Wealthy people get more legal rights"]}, {"section": "Rights", "prompts": ["What does accountability mean?", "A leader explains decisions and accepts consequences. What is this?"], "corrects": ["Taking responsibility for actions and decisions", "Being answerable for what you do"], "wrongs": ["Avoiding questions about your choices", "Making decisions without explaining them", "Giving every duty to someone else"]}, {"section": "Democratic ideals", "prompts": ["Name some democratic ideals.", "Which set includes democratic ideals?"], "corrects": ["Equality, freedom, fairness, and participation", "Equal rights, liberty, fairness, and public involvement"], "wrongs": ["Censorship, corruption, and fear", "Inherited power and no public debate", "One-party control and unequal rights"]}, {"section": "Rights", "prompts": ["What can citizens often do in a democracy?", "Which statement describes citizens' role in a democracy?"], "corrects": ["Vote, express opinions, and participate in public life", "Vote, share views, and take part in community decisions"], "wrongs": ["Never question leaders", "Make every court decision personally", "Be barred from political discussion"]}, {"section": "Rights", "prompts": ["What may citizens experience under authoritarian rule?", "Compared with a democracy, citizens in an authoritarian system often have…"], "corrects": ["Fewer political freedoms and less influence over leaders", "More restrictions on political participation and criticism"], "wrongs": ["Complete control over every national decision", "A guaranteed right to remove leaders at any time", "The right to approve every law directly"]}, {"section": "First Nations government", "prompts": ["What decision-making approach should you choose for First Nations?", "What is the answer for First Nations decision-making in this quiz?"], "corrects": ["Consensus", "Consensus"], "wrongs": ["Majority rule", "Dictatorship", "Monarchy"]}, {"section": "Government systems — advantages", "prompts": ["What is a possible advantage of monarchy?", "What can a monarchy sometimes provide?"], "corrects": ["Continuity and a lasting national symbol", "A stable tradition and a symbol of national identity"], "wrongs": ["A guarantee that every decision is democratic", "Equal political power for every citizen", "A need for no laws or elections"]}, {"section": "Government systems — advantages", "prompts": ["What is a possible advantage sometimes claimed for oligarchy?", "Why might a small ruling group make decisions quickly?"], "corrects": ["A small group may make decisions quickly", "Fewer decision-makers can sometimes act quickly"], "wrongs": ["Every citizen has equal power", "All groups are guaranteed equal representation", "Leaders are always elected by the public"]}, {"section": "Government systems — advantages", "prompts": ["What is an advantage sometimes claimed for dictatorship?", "Why might a dictatorship make a decision quickly?"], "corrects": ["A single leader can make decisions quickly", "Decisions may be made quickly without lengthy debate"], "wrongs": ["Citizens always have more freedom", "Power is always shared fairly", "Every decision requires a public vote"]}, {"section": "Government systems — advantages", "prompts": ["What is one advantage of direct democracy?", "Why can direct democracy increase participation?"], "corrects": ["Citizens vote directly on issues that affect them", "People can have a direct say on specific decisions"], "wrongs": ["Citizens never need to learn about issues", "All decisions go to unelected officials", "Disagreement disappears completely"]}, {"section": "Government systems — advantages", "prompts": ["What is one advantage of indirect democracy?", "Why can representative democracy be practical for a large country?"], "corrects": ["Representatives can study and decide many issues on citizens' behalf", "Elected representatives can focus on complex issues for the public"], "wrongs": ["Citizens vote directly on every government action", "People do not choose their representatives", "A small unelected group controls all power"]}, {"section": "Government systems — disadvantages", "prompts": ["What is a possible disadvantage of monarchy?", "What can be a concern about hereditary monarchy?"], "corrects": ["A leader may get the position by birth instead of public choice", "The monarch's position may not depend on voters' choice"], "wrongs": ["Every monarch must be elected", "Everyone always has equal political power", "Every citizen must vote on every law"]}, {"section": "Government systems — disadvantages", "prompts": ["What is a possible disadvantage of oligarchy?", "What can go wrong when a small group holds power?"], "corrects": ["The powerful few may put their own interests first", "A small ruling group may ignore the wider public"], "wrongs": ["Every citizen is guaranteed equal influence", "All decisions require a public referendum", "No group can gain more power"]}, {"section": "Government systems — disadvantages", "prompts": ["What is a major disadvantage of dictatorship?", "Why can dictatorship be harmful?"], "corrects": ["A ruler may abuse power and restrict people's rights", "The leader may limit freedoms and face few checks"], "wrongs": ["Citizens have too many elections", "Leaders must always share power with opponents", "Every policy is decided by public vote"]}, {"section": "Government systems — disadvantages", "prompts": ["What is one disadvantage of direct democracy?", "Why can direct democracy be difficult for every decision?"], "corrects": ["It can take a lot of time to discuss and vote on each issue", "It may be slow and difficult to use for every issue"], "wrongs": ["Citizens cannot express their views", "Only one ruler can vote", "Representatives cannot be elected"]}, {"section": "Government systems — disadvantages", "prompts": ["What is one disadvantage of indirect democracy?", "What is a possible problem with elected representatives?"], "corrects": ["Representatives may make choices some voters disagree with", "Elected leaders may not always reflect every voter's wishes"], "wrongs": ["Representatives cannot make decisions", "Citizens must vote on every law directly", "Leaders are always chosen by family inheritance"]}, {"section": "Obstacles to democracy", "prompts": ["Which is an obstacle to democracy?", "What can make democratic cooperation harder between ethnic groups?"], "corrects": ["Ethnic differences and conflicts", "Tension or conflict between ethnic groups"], "wrongs": ["High public participation", "Equal access to education", "Open and honest elections"]}, {"section": "Obstacles to democracy", "prompts": ["Which is an obstacle to democracy?", "What obstacle describes a large difference in people's wealth?"], "corrects": ["A wide gap between rich and poor", "A large economic gap between wealthy and poor people"], "wrongs": ["Strong rule of law", "A free and independent press", "High literacy across the population"]}, {"section": "Obstacles to democracy", "prompts": ["Which is an obstacle to democracy?", "What problem exists when many people have difficulty reading?"], "corrects": ["A low literacy rate", "Low levels of reading and writing ability"], "wrongs": ["Equal legal protection", "A variety of news sources", "Public consultation"]}, {"section": "Obstacles to democracy", "prompts": ["Which is an obstacle to democracy?", "What is it called when officials misuse power for personal benefit?"], "corrects": ["Corruption", "Dishonest use of public power, such as bribery"], "wrongs": ["Consultation", "Consensus", "Accountability"]}, {"section": "Obstacles to democracy", "prompts": ["Which is an obstacle to democracy?", "What is a problem when very few citizens vote or take part in public life?"], "corrects": ["Very little political participation", "Low involvement in voting and political activities"], "wrongs": ["A strong opposition party", "Public consultation", "A free press"]}, {"section": "Canada's government", "prompts": ["What does constitutional monarchy mean in Canada?", "Canada is a constitutional monarchy. What does this mean?"], "corrects": ["The monarch is head of state, but powers are limited by the Constitution and laws", "Canada has a monarch as head of state whose role is governed by constitutional rules"], "wrongs": ["The monarch personally makes every law without limits", "Canada has no elected government", "Citizens vote directly on every national law"]}, {"section": "Canada's government", "prompts": ["What is a parliamentary democracy in Canada?", "How does Canada's parliamentary democracy work?"], "corrects": ["People elect representatives to Parliament, and the government must maintain Parliament's confidence", "Voters elect members of Parliament, and the government needs the confidence of the elected House"], "wrongs": ["A monarch makes all decisions without elected representatives", "Citizens vote directly on every federal law", "Courts choose all members of Parliament"]}, {"section": "Canada's government", "prompts": ["What does Canada's federal system mean?", "How is power divided in Canada's federal system?"], "corrects": ["Powers are divided between federal and provincial or territorial governments", "Different levels of government have their own areas of responsibility"], "wrongs": ["All power belongs only to municipalities", "Each province is a separate country with no national government", "The monarch makes every local decision"]}, {"section": "Voting", "prompts": ["What does referendum mean?", "Which situation is a referendum?"], "corrects": ["Voters directly vote on a specific question or proposal", "A public vote on a particular issue"], "wrongs": ["Representatives privately discuss a bill", "A judge decides an election result", "A monarch selects a political party"]}, {"section": "Government", "prompts": ["What does totalitarian mean?", "Which description fits a totalitarian government?"], "corrects": ["A government tries to control nearly every part of public and private life", "A system where the state seeks extensive control over society and people's lives"], "wrongs": ["Citizens can freely challenge every decision", "Government only provides local parks", "Power is shared equally among everyone"]}, {"section": "Vocabulary", "prompts": ["What does egalitarian mean?", "An egalitarian society aims for…"], "corrects": ["Equality and equal rights for people", "Fairness and equal status among people"], "wrongs": ["Power held by one ruler", "Control by a small elite", "Decisions made only by judges"]}, {"section": "Vocabulary", "prompts": ["What does government power mean?", "Government power is the ability to…"], "corrects": ["Make and enforce laws, decisions, and policies", "Create rules and put public decisions into action"], "wrongs": ["Choose every person's beliefs", "Prevent all disagreement", "Change the weather"]}, {"section": "Vocabulary", "prompts": ["What does coercion mean?", "Which example shows coercion?"], "corrects": ["Using threats or pressure to make someone do something", "Pressuring someone through threats so they comply"], "wrongs": ["Asking people for advice", "Helping two sides reach a voluntary agreement", "Accepting responsibility for a mistake"]}, {"section": "Vocabulary", "prompts": ["What is a dispute or conflict?", "Which statement best describes a dispute?"], "corrects": ["A disagreement or clash between people or groups", "A situation where people or groups disagree"], "wrongs": ["Complete agreement among everyone", "A public election", "A government service"]}, {"section": "Vocabulary", "prompts": ["What does irresponsible mean?", "Which action is irresponsible?"], "corrects": ["Failing to take proper care or accept duties", "Not acting carefully or neglecting responsibilities"], "wrongs": ["Accepting consequences for your choices", "Keeping a promise", "Completing your work carefully"]}, {"section": "Vocabulary", "prompts": ["What does restitution mean?", "Which example shows restitution?"], "corrects": ["Returning or restoring what was lost or damaged", "Giving back or restoring something to make up for a wrong"], "wrongs": ["Paying everyone the same wage", "Asking two sides to agree", "Making a new law after an election"]}, {"section": "Vocabulary", "prompts": ["What does compensation mean?", "Which example shows compensation?"], "corrects": ["Something given to make up for a loss, work, or damage", "Payment or another benefit given to make up for a loss"], "wrongs": ["Forcing someone to agree", "Choosing an election representative", "Ignoring a dispute"]}, {"section": "Vocabulary", "prompts": ["What does negotiate mean?", "When people negotiate, they…"], "corrects": ["Discuss an issue to try to reach an agreement", "Talk through terms to find an agreement"], "wrongs": ["Force the other side to obey", "Ask a judge for a final ruling", "Ignore the other side"]}, {"section": "Vocabulary", "prompts": ["What does arbitrate mean?", "When a neutral person arbitrates a disagreement, they…"], "corrects": ["Hear both sides and make a decision to settle the dispute", "Act as a neutral decision-maker in a disagreement"], "wrongs": ["Help people talk without deciding the outcome", "Vote for a representative", "Return lost property"]}, {"section": "Vocabulary", "prompts": ["What does a judge do?", "Which description best fits a judge?"], "corrects": ["Applies the law and makes legal decisions in court", "Makes legal rulings after considering the case"], "wrongs": ["Asks the public for policy advice", "Runs a political campaign", "Makes every law alone"]}, {"section": "Vocabulary", "prompts": ["What does mediate mean?", "A mediator helps people by…"], "corrects": ["Helping both sides communicate and work toward an agreement", "Guiding people through discussion so they can find common ground"], "wrongs": ["Forcing one side to accept punishment", "Making a court's final ruling", "Ignoring the disagreement"]}, {"section": "Vocabulary", "prompts": ["What does intervene mean?", "Which example shows someone intervening?"], "corrects": ["Become involved to affect a situation or help resolve it", "Step into a situation to change what happens"], "wrongs": ["Stay completely uninvolved", "Decide only through a public vote", "Return money for a loss"]},{"section":"Democracy","prompts":["What is one thing that can be bad about democracy?","What is a possible problem in a democracy?"],"corrects":["People's rights are sometimes not respected","People's rights are sometimes not respected"],"wrongs":["Everyone always agrees","There are no elections","Only a king can vote"]},{"section":"Democracy","prompts":["What makes a democracy healthy?","Which factor can help make democracy healthy?"],"corrects":["A high literacy rate","A high literacy rate"],"wrongs":["A low literacy rate","No public participation","No free press"]},{"section":"Canada's government","prompts":["Who is Canada's head of state?","In Canada's system, who is the head of state?"],"corrects":["The King","The King"],"wrongs":["The Prime Minister","The Speaker of the House","The Premier"]},{"section":"Canada's government","prompts":["How many levels of government are in Canada's federal system, according to this quiz?","How many levels of government does the federal system have?"],"corrects":["2 levels","2 levels"],"wrongs":["1 level","3 levels","5 levels"]},{"section":"Canada's government","prompts":["What group advises the Prime Minister and is in charge of portfolios?","Which group gives advice to the Prime Minister and manages portfolios?"],"corrects":["The Cabinet","The Cabinet"],"wrongs":["The Supreme Court","The opposition party","The Senate"]},{"section":"Canada's government","prompts":["Which branch of government is responsible for making laws?","What branch of government is responsible for laws?"],"corrects":["The legislative branch","The legislative branch"],"wrongs":["The executive branch","The judicial branch","The municipal branch"]},{"section":"Vocabulary","prompts":["What is the root meaning of 'parliamentary'?","The root meaning of 'parliamentary' is…"],"corrects":["To talk","To talk"],"wrongs":["To rule","To judge","To vote"]},{"section":"Government systems","prompts":["Can a country be both a monarchy and a democracy?","Can a government be a monarchy and a democracy at the same time?"],"corrects":["Yes","Yes"],"wrongs":["No, never","Only if there are no elections","Only if the monarch makes every law"]}];
let quiz=[],current=0,score=0,answered=false,lastCorrectPosition=-1,missed=[];
const $=id=>document.getElementById(id);
function shuffle(a){const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]];}return b;}
function startQuiz(onlyMissed=false){const source=onlyMissed&&missed.length?missed.map(x=>x.item):bank;quiz=shuffle(source.map(item=>({...item,prompt:shuffle(item.prompts)[0],correct:shuffle(item.corrects)[0]})));current=0;score=0;answered=false;lastCorrectPosition=-1;missed=[];$('quizPanel').classList.remove('hidden');$('result').classList.add('hidden');$('score').textContent='Score: 0';showQuestion();}

function getBalancedDistractors(q) {
  // Keep wrong answers specific to this question, but deliberately vary their
  // lengths so the correct answer is not consistently the 1st, 2nd, 3rd, or 4th
  // longest choice. We lengthen two or three distractors per question.
  let options = shuffle([...new Set(q.wrongs || [])].filter(text => text !== q.correct));
  options = options.slice(0, 3);
  const targetLonger = 2 + Math.floor(Math.random() * 2); // two or three wrong answers longer
  const extras = [
    ', even though this is not how the system works',
    ', regardless of what the public wants',
    ', in every case, even when the opposite is true',
    ', even if it contradicts the basic definition',
    ', as the only rule for every government everywhere'
  ];
  // Prefer lengthening choices that are currently shorter, using different
  // plausible-sounding but incorrect qualifiers rather than one repeated suffix.
  const indices = shuffle(options.map((_, i) => i));
  let longerCount = options.filter(text => text.length > q.correct.length).length;
  for (const idx of indices) {
    if (longerCount >= targetLonger) break;
    if (options[idx].length > q.correct.length) continue;
    const suffix = shuffle(extras).find(extra => (options[idx] + extra).length > q.correct.length);
    if (suffix) {
      options[idx] += suffix;
      longerCount++;
    }
  }
  // If naturally long distractors already exceed the target, keep them: never
  // shorten or change the meaning of an existing wrong answer just to hit a rank.
  return shuffle(options);
}
function showQuestion(){answered=false;const q=quiz[current];$('number').textContent=`Question ${current+1} of ${quiz.length}`;$('score').textContent=`Score: ${score}`;$('bar').style.width=`${current/quiz.length*100}%`;$('section').textContent=q.section;$('question').textContent=q.prompt;$('choices').innerHTML='';$('feedback').textContent='';$('feedback').className='feedback';$('next').disabled=true;$('next').textContent=current===quiz.length-1?'See results':'Next question';let answers=shuffle([{text:q.correct,correct:true},...getBalancedDistractors(q).map(text=>({text,correct:false}))]);while(answers.findIndex(a=>a.correct)===lastCorrectPosition){answers=shuffle(answers);}lastCorrectPosition=answers.findIndex(a=>a.correct);answers.forEach((a,i)=>{const b=document.createElement('button');b.className='choice';b.type='button';const l=document.createElement('span');l.className='letter';l.textContent=String.fromCharCode(65+i);const t=document.createElement('span');t.textContent=a.text;b.append(l,t);b.onclick=()=>choose(b,a,q);$('choices').appendChild(b);});}
function choose(button,answer,q){if(answered)return;answered=true;document.querySelectorAll('.choice').forEach(b=>b.disabled=true);if(answer.correct){score++;button.classList.add('correct');$('feedback').textContent='Correct!';$('feedback').classList.add('good');}else{button.classList.add('wrong');const correctText=q.correct;$('feedback').textContent='Not quite. Correct answer: '+correctText;$('feedback').classList.add('bad');document.querySelectorAll('.choice').forEach(b=>{if(b.lastChild.textContent===correctText)b.classList.add('correct');});missed.push({item:q,prompt:q.prompt});}$('score').textContent=`Score: ${score}`;$('next').disabled=false;}
function results(){$('quizPanel').classList.add('hidden');$('result').classList.remove('hidden');$('bar').style.width='100%';$('finalScore').textContent=`${score} / ${quiz.length} (${Math.round(score/quiz.length*100)}%)`;const p=score/quiz.length;$('message').textContent=p===1?'Perfect score!':p>=.8?'Great work! Review the topics you missed and try again.':p>=.6?'Good effort. Review the definitions and try another shuffled round.':'Keep practicing. The next round will use a new question and answer order.';$('missedList').classList.add('hidden');$('missedList').innerHTML='';$('review').classList.toggle('hidden',missed.length===0);}
$('next').onclick=()=>{if(!answered)return;if(current<quiz.length-1){current++;showQuestion();}else results();};$('restart').onclick=()=>startQuiz();$('again').onclick=()=>startQuiz();$('review').onclick=()=>{if(!missed.length)return;$('missedList').innerHTML='<h3>Questions to review</h3>'+missed.map(x=>'<p><strong>'+esc(x.prompt)+'</strong><br>Answer: '+esc(x.item.corrects[0])+'</p>').join('');$('missedList').classList.remove('hidden');};function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
startQuiz();
</script></body></html>
